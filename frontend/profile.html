<!doctype html>
<html lang="en">
  <head>
    <script>
      (function useCanonicalLocalApp() {
        const isLocal = ["localhost", "127.0.0.1"].includes(
          window.location.hostname,
        );
        if (
          isLocal &&
          (window.location.hostname !== "localhost" ||
            window.location.port !== "3000")
        ) {
          window.location.replace(
            `http://localhost:3000${window.location.pathname}${window.location.search}${window.location.hash}`,
          );
        }
      })();
    </script>
    <script src="/js/config.js"></script>
    <script src="/js/api-client.js"></script>
    <!-- Shared session: the profile page never asks for a second login, it
       reuses the session created on login.html. -->
    <script src="/js/session.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <title>Profile - GoSmoothie</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { primary: "#4ade80", secondary: "#f97316" },
            borderRadius: {
              none: "0px",
              sm: "4px",
              DEFAULT: "8px",
              md: "12px",
              lg: "16px",
              xl: "20px",
              "2xl": "24px",
              "3xl": "32px",
              full: "9999px",
              button: "8px",
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
<link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
      <link rel="stylesheet" href="/css/toast.css" />
    <link rel="stylesheet" href="/css/profile.css" />
  </head>
  <body
    class="bg-gradient-to-br from-green-50 via-white to-orange-50 min-h-screen text-gray-900"
  >
    <div class="profile-glow w-80 h-80 bg-green-200/55 -top-28 -left-28"></div>
    <div
      class="profile-glow w-[28rem] h-[28rem] bg-orange-100/70 -bottom-48 -right-44"
    ></div>
    <!-- Header -->
    <header
      class="fixed top-0 left-0 right-0 z-50 bg-white/95 backdrop-blur border-b border-green-100 shadow-sm"
    >
      <div
        class="container mx-auto px-4 py-3 flex items-center justify-between"
      >
        <a href="/main.html" class="text-3xl font-['Pacifico'] text-primary"
          >GoSmoothie</a
        >
        <nav class="flex items-center gap-3 sm:gap-6 text-sm sm:text-base">
          <a
            href="/main.html"
            class="hidden sm:inline text-gray-700 hover:text-primary transition"
            >Home</a
          >
          <a
            href="/menu.html"
            class="hidden sm:inline text-gray-700 hover:text-primary transition"
            >Menu</a
          >
          <a
            href="/cart.html"
            class="inline-flex items-center gap-2 text-gray-700 hover:text-primary transition"
          >
            <i class="bi bi-cart"></i><span class="hidden sm:inline">Cart</span>
          </a>
          <a
            href="/profile.html"
            class="px-4 py-2 rounded-lg bg-green-50 text-green-700 font-semibold"
            >Profile</a
          >
        </nav>
      </div>
    </header>

    <!-- Profile Section -->
    <section class="pt-28 pb-16">
      <div class="container mx-auto px-4 max-w-6xl">
        <!-- Back Button -->
        <div class="mb-6 flex items-center justify-between gap-4">
          <a
            href="/main.html"
            aria-label="Back to home"
            title="Back to home"
            class="inline-flex items-center gap-2 px-4 py-2 bg-white border border-gray-200 text-gray-700 hover:border-primary hover:text-primary transition rounded-lg font-medium shadow-sm"
          >
            <i class="bi bi-arrow-left text-lg"></i>
          </a>
          <span
            class="hidden sm:inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-green-100 text-green-700 text-sm font-semibold"
          >
            <i class="bi bi-shield-check"></i> Secure account
          </span>
        </div>

        <div class="mb-10 relative">
          <span
            class="inline-flex items-center gap-2 px-3 py-1.5 mb-4 rounded-full bg-white/80 ring-1 ring-green-200 text-green-700 text-xs font-bold uppercase tracking-[0.16em] shadow-sm"
          >
            <i class="bi bi-stars text-xs"></i> Account center
          </span>
          <h1
            class="text-4xl md:text-5xl font-extrabold bg-gradient-to-r from-slate-900 via-green-800 to-green-600 bg-clip-text text-transparent"
          >
            Your Account
          </h1>
          <p class="text-gray-600 mt-2">
            Manage your personal details, delivery addresses, and account
            security.
          </p>
        </div>
        <div id="content" class="space-y-8">Loading profile...</div>
      </div>
    </section>


    <!-- Global Modal (hidden by default) -->
    <div
      id="globalModal"
      class="hidden fixed inset-0 z-60 flex items-center justify-center bg-black/50"
      aria-hidden="true"
    >
      <div
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
        class="bg-white max-w-md w-full rounded-xl shadow-lg p-6 mx-4"
      >
        <div class="flex items-start gap-4">
          <div id="modalIcon" class="text-2xl"></div>
          <div class="flex-1">
            <h3 id="modalTitle" class="text-lg font-semibold text-gray-900">
              Title
            </h3>
            <p id="modalMessage" class="text-sm text-gray-600 mt-2">Message</p>
          </div>
        </div>
        <div class="mt-6 flex justify-end gap-3">
          <button
            id="modalCancel"
            class="px-4 py-2 rounded-button bg-gray-100 text-gray-800 hover:bg-gray-200 transition"
          >
            Cancel
          </button>
          <button
            id="modalOk"
            class="px-4 py-2 rounded-button bg-primary text-white hover:bg-green-600 transition"
          >
            OK
          </button>
        </div>
      </div>
    </div>
      <script src="/js/toast.js"></script>
    <script src="/js/profile.js"></script>
  </body>
</html>
