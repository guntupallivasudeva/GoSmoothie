<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - GoSmoothie</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { primary: "#4ade80", secondary: "#f97316" },
            borderRadius: {
              none: "0px",
              sm: "4px",
              DEFAULT: "8px",
              md: "12px",
              lg: "16px",
              xl: "20px",
              "2xl": "24px",
              "3xl": "32px",
              full: "9999px",
              button: "8px",
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
      }
    </style>
  </head>
  <body class="bg-gradient-to-br from-gray-50 to-white min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm">
      <div
        class="container mx-auto px-4 py-4 flex items-center justify-between"
      >
        <a href="/main.html" class="text-2xl font-['Pacifico'] text-primary"
          >GoSmoothie</a
        >
        <nav class="flex space-x-6">
          <a
            href="/main.html"
            class="text-gray-700 hover:text-primary transition"
            >Home</a
          >
          <a
            href="/cart.html"
            class="text-gray-700 hover:text-primary transition"
            >Cart</a
          >
          <a href="/profile.html" class="text-primary font-semibold">Profile</a>
        </nav>
      </div>
    </header>

    <!-- Profile Section -->
    <section class="py-12">
      <div class="container mx-auto px-4 max-w-4xl">
        <!-- Back Button -->
        <div class="mb-6">
          <a
            href="/main.html"
            class="inline-flex items-center gap-2 px-4 py-2 bg-gray-100 text-gray-700 hover:bg-gray-200 hover:text-primary transition rounded-lg font-medium"
          >
            <i class="ri-arrow-left-line text-lg"></i>
          </a>
        </div>

        <h1 class="text-3xl font-bold text-gray-900 mb-8">Your Account</h1>
        <div id="content" class="space-y-6">Loading profile...</div>
      </div>
    </section>

    <script>
      const tokenKey = "gs_token";
      const userKey = "gs_user";

      const profileState = {
        name: "",
        email: "",
        phone: "",
        addresses: [],
        editingAddressId: null,
      };

      function getToken() {
        return localStorage.getItem(tokenKey);
      }
      function getUser() {
        const u = localStorage.getItem(userKey);
        return u ? JSON.parse(u) : null;
      }
      function setUser(u) {
        localStorage.setItem(userKey, JSON.stringify(u));
      }
      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      async function apiJson(url, options = {}) {
        const res = await fetch(url, options);
        let data = null;
        try {
          data = await res.json();
        } catch (_) {}
        if (!res.ok) throw new Error((data && data.error) || "Request failed");
        return data;
      }

      function normalizeAddresses(addresses = []) {
        return addresses
          .map((addr) => ({
            _id:
              addr._id ||
              addr.id ||
              `addr_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
            label: (addr.label || "Home").trim(),
            street: (addr.street || "").trim(),
            city: (addr.city || "").trim(),
            zip: (addr.zip || "").trim(),
            notes: (addr.notes || "").trim(),
            isDefault: !!addr.isDefault,
          }))
          .filter((addr) => addr.label || addr.street || addr.city || addr.zip);
      }

      async function persistProfile(statusEl) {
        const token = getToken();
        const payload = {
          name: profileState.name,
          email: profileState.email,
          phone: profileState.phone,
          addresses: profileState.addresses,
        };
        const data = await apiJson("/api/users/me", {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token,
          },
          body: JSON.stringify(payload),
        });
        setUser({
          name: data.name,
          email: data.email,
          phone: data.phone || "",
        });
        profileState.name = data.name;
        profileState.email = data.email;
        profileState.phone = data.phone || "";
        profileState.addresses = normalizeAddresses(data.addresses || []);
        if (statusEl) {
          statusEl.className =
            "p-3 bg-green-50 border-l-4 border-green-500 text-green-700 text-sm rounded";
          statusEl.textContent = "Profile updated successfully";
          statusEl.classList.remove("hidden");
        }
        return data;
      }

      function setAddressFormVisible(visible) {
        const form = document.getElementById("addressForm");
        if (!form) return;
        // The overlay centres its panel with flex, so toggle both classes.
        form.classList.toggle("hidden", !visible);
        form.classList.toggle("flex", visible);
        form.setAttribute("aria-hidden", visible ? "false" : "true");
        // Stop the page behind the modal from scrolling.
        document.body.style.overflow = visible ? "hidden" : "";
      }

      function closeAddressForm() {
        clearAddressForm();
        setAddressFormVisible(false);
        const status = document.getElementById("addressStatus");
        if (status) status.classList.add("hidden");
      }

      function clearAddressForm() {
        profileState.editingAddressId = null;
        const ids = [
          "addressLabel",
          "addressStreet",
          "addressCity",
          "addressZip",
          "addressNotes",
        ];
        ids.forEach((id) => {
          const el = document.getElementById(id);
          if (el) el.value = "";
        });
        const def = document.getElementById("addressDefault");
        if (def) def.checked = false;
        const saveBtn = document.getElementById("saveAddressBtn");
        if (saveBtn) saveBtn.textContent = "Save Address";
      }

      function openAddressForm(address = null) {
        profileState.editingAddressId = address ? address._id : null;
        const label = document.getElementById("addressLabel");
        const street = document.getElementById("addressStreet");
        const city = document.getElementById("addressCity");
        const zip = document.getElementById("addressZip");
        const notes = document.getElementById("addressNotes");
        const isDefault = document.getElementById("addressDefault");
        const saveBtn = document.getElementById("saveAddressBtn");

        if (label) label.value = address ? address.label : "";
        if (street) street.value = address ? address.street : "";
        if (city) city.value = address ? address.city : "";
        if (zip) zip.value = address ? address.zip : "";
        if (notes) notes.value = address ? address.notes : "";
        if (isDefault)
          isDefault.checked = address ? !!address.isDefault : false;
        if (saveBtn)
          saveBtn.textContent = address ? "Update Address" : "Save Address";

        const title = document.getElementById("addressFormTitle");
        if (title)
          title.textContent = address ? "Edit Address" : "Add New Address";

        const status = document.getElementById("addressStatus");
        if (status) status.classList.add("hidden");

        setAddressFormVisible(true);
        const firstField = document.getElementById("addressLabel");
        if (firstField) firstField.focus();
      }

      // Global modal helper (available to all functions)
      function showModal({
        title = "Confirm",
        message = "",
        type = "info",
        okText = "OK",
        cancelText = "Cancel",
      } = {}) {
        return new Promise((resolve) => {
          const modal = document.getElementById("globalModal");
          const titleEl = document.getElementById("modalTitle");
          const msgEl = document.getElementById("modalMessage");
          const okBtn = document.getElementById("modalOk");
          const cancelBtn = document.getElementById("modalCancel");
          const icon = document.getElementById("modalIcon");

          if (!modal || !okBtn || !cancelBtn) {
            // Fallback confirm when modal elements are not present
            const choice = confirm(message || title);
            resolve(choice);
            return;
          }

          titleEl.textContent = title;
          msgEl.textContent = message;
          okBtn.textContent = okText;
          cancelBtn.textContent = cancelText;

          icon.className = "";
          if (type === "warning")
            icon.innerHTML = '<i class="ri-alert-line text-yellow-500"></i>';
          else if (type === "error")
            icon.innerHTML =
              '<i class="ri-close-circle-line text-red-500"></i>';
          else if (type === "success")
            icon.innerHTML =
              '<i class="ri-checkbox-circle-line text-green-500"></i>';
          else
            icon.innerHTML =
              '<i class="ri-information-line text-blue-500"></i>';

          modal.classList.remove("hidden");
          modal.setAttribute("aria-hidden", "false");

          function cleanup(choice) {
            modal.classList.add("hidden");
            modal.setAttribute("aria-hidden", "true");
            okBtn.removeEventListener("click", onOk);
            cancelBtn.removeEventListener("click", onCancel);
            modal.removeEventListener("click", onBackdrop);
            resolve(choice);
          }

          function onOk(e) {
            e.stopPropagation();
            cleanup(true);
          }
          function onCancel(e) {
            e.stopPropagation();
            cleanup(false);
          }
          function onBackdrop(e) {
            if (e.target === modal) cleanup(false);
          }

          okBtn.addEventListener("click", onOk);
          cancelBtn.addEventListener("click", onCancel);
          modal.addEventListener("click", onBackdrop);
        });
      }

      function renderAddresses() {
        const list = document.getElementById("addressesList");
        if (!list) return;
        const addresses = profileState.addresses || [];
        if (!addresses.length) {
          list.innerHTML = `
        <div class="rounded-xl border border-dashed border-gray-300 p-5 text-gray-500">
          No saved addresses yet. Add one so checkout can use it.
        </div>
      `;
          return;
        }

        list.innerHTML = addresses
          .map(
            (addr) => `
      <div class="rounded-xl border border-gray-200 p-4 ${addr.isDefault ? "ring-2 ring-primary/20 border-primary/40 bg-primary/5" : "bg-white"}" data-address-id="${escapeHtml(addr._id)}">
        <div class="flex items-start justify-between gap-4">
          <div>
            <div class="flex items-center gap-2 mb-1">
              <h3 class="font-semibold text-gray-900">${escapeHtml(addr.label || "Address")}</h3>
              ${addr.isDefault ? '<span class="text-xs font-semibold px-2 py-1 rounded-full bg-primary text-white">Default</span>' : ""}
            </div>
            <p class="text-sm text-gray-700">${escapeHtml(addr.street)}</p>
            <p class="text-sm text-gray-700">${escapeHtml(addr.city)} ${escapeHtml(addr.zip)}</p>
            ${addr.notes ? `<p class="text-sm text-gray-500 mt-1">${escapeHtml(addr.notes)}</p>` : ""}
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <button data-action="edit" type="button" title="Edit address" aria-label="Edit address" class="w-10 h-10 flex items-center justify-center rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-700 transition">
              <i class="ri-pencil-line text-lg"></i>
            </button>
            <button data-action="default" type="button" title="${addr.isDefault ? "Default address" : "Set as default"}" aria-label="${addr.isDefault ? "Default address" : "Set as default"}" class="w-10 h-10 flex items-center justify-center rounded-lg transition ${addr.isDefault ? "bg-primary text-white cursor-default" : "bg-primary/10 hover:bg-primary/20 text-primary"}"${addr.isDefault ? " disabled" : ""}>
              <i class="${addr.isDefault ? "ri-star-fill" : "ri-star-line"} text-lg"></i>
            </button>
            <button data-action="delete" type="button" title="Delete address" aria-label="Delete address" class="w-10 h-10 flex items-center justify-center rounded-lg bg-red-50 hover:bg-red-100 text-red-600 transition">
              <i class="ri-delete-bin-line text-lg"></i>
            </button>
          </div>
        </div>
      </div>
    `,
          )
          .join("");

        // Edit / default / delete clicks are handled by the delegated
        // listener on #addressesList in showProfile(). Binding them here as
        // well made every action fire twice (Delete confirmed twice, Set
        // Default saved twice), so this function only renders markup.
      }

      async function showProfile() {
        const token = getToken();
        if (!token) {
          document.getElementById("content").innerHTML = `
        <div class="bg-yellow-50 border-2 border-yellow-200 rounded-lg p-6 text-center">
          <p class="text-gray-700 mb-4">You need to be logged in to view your profile.</p>
          <a href="/login.html" class="inline-block bg-primary text-white px-6 py-2 !rounded-button font-semibold hover:bg-green-600 transition">Login Now</a>
        </div>
      `;
          return;
        }

        let me;
        try {
          me = await apiJson("/api/users/me", {
            headers: { Authorization: "Bearer " + token },
          });
        } catch (err) {
          document.getElementById("content").innerHTML = `
        <div class="bg-yellow-50 border-2 border-yellow-200 rounded-lg p-6 text-center">
          <p class="text-gray-700 mb-4">Session expired or you need to log in again.</p>
          <a href="/login.html" class="inline-block bg-primary text-white px-6 py-2 !rounded-button font-semibold hover:bg-green-600 transition">Login Now</a>
        </div>
      `;
          return;
        }

        profileState.name = me.name || "";
        profileState.email = me.email || "";
        profileState.phone = me.phone || "";
        profileState.addresses = normalizeAddresses(me.addresses || []);
        setUser({
          name: profileState.name,
          email: profileState.email,
          phone: profileState.phone,
        });

        document.getElementById("content").innerHTML = `
      <div class="bg-white rounded-xl shadow-lg p-8">
        <div class="flex items-center justify-between mb-8">
          <h2 class="text-2xl font-bold text-gray-900">Account Information</h2>
          <button id="editBtn" class="flex items-center gap-2 px-4 py-2 bg-primary text-white !rounded-button hover:bg-green-600 transition">
            <i class="ri-edit-line"></i> Edit Profile
          </button>
        </div>

        <div id="viewForm" class="space-y-6">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="text-sm font-medium text-gray-600">Full Name</label>
              <p class="text-2xl font-bold text-gray-900 mt-2">${escapeHtml(profileState.name)}</p>
            </div>
            <div>
              <label class="text-sm font-medium text-gray-600">Email Address</label>
              <p class="text-2xl font-bold text-gray-900 mt-2">${escapeHtml(profileState.email)}</p>
            </div>
            <div>
              <label class="text-sm font-medium text-gray-600">Phone Number</label>
              <p class="text-2xl font-bold text-gray-900 mt-2">${escapeHtml(profileState.phone || "-")}</p>
            </div>
          </div>
        </div>

        <!-- Edit profile modal. Field ids are unchanged so the existing
             save/validation logic keeps working as-is. -->
        <div id="editForm" style="display:none;" class="space-y-5">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
            <input id="editName" type="text" value="${escapeHtml(profileState.name)}" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-primary transition">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
            <input id="editEmail" type="email" value="${escapeHtml(profileState.email)}" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-primary transition">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Phone Number</label>
            <input id="editPhone" type="tel" value="${escapeHtml(profileState.phone)}" placeholder="Phone number" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-primary transition">
          </div>
          <div id="editStatus" class="hidden p-3 bg-blue-50 border-l-4 border-blue-500 text-blue-700 text-sm rounded"></div>
          <div class="flex gap-3">
            <button id="saveBtn" class="px-6 py-3 bg-primary text-white !rounded-button font-semibold hover:bg-green-600 transition">Save Changes</button>
            <button id="cancelBtn" class="px-6 py-3 bg-gray-200 text-gray-800 !rounded-button font-semibold hover:bg-gray-300 transition">Cancel</button>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-lg p-8">
        <div class="flex items-center justify-between mb-8">
          <h2 class="text-2xl font-bold text-gray-900">Saved Addresses</h2>
          <button id="addAddressBtn" class="flex items-center gap-2 px-4 py-2 bg-primary text-white !rounded-button hover:bg-green-600 transition">
            <i class="ri-add-line"></i> Add Address
          </button>
        </div>
        <div id="addressesList" class="space-y-4"></div>

        <!-- Address add/edit modal. Field ids are unchanged so the existing
             open/clear/save logic keeps working as-is. -->
        <div id="addressForm" class="hidden fixed inset-0 z-[60] items-center justify-center bg-black/50 p-4" aria-hidden="true">
          <div role="dialog" aria-modal="true" aria-labelledby="addressFormTitle" class="bg-white w-full max-w-2xl rounded-xl shadow-xl p-6 md:p-8 max-h-[90vh] overflow-y-auto">
          <div class="flex items-start justify-between gap-4 mb-6">
            <h3 class="text-xl font-semibold text-gray-900" id="addressFormTitle">Add New Address</h3>
            <button id="closeAddressBtn" type="button" aria-label="Close" class="w-9 h-9 flex items-center justify-center rounded-lg text-gray-500 hover:bg-gray-100 hover:text-gray-700 transition shrink-0">
              <i class="ri-close-line text-xl"></i>
            </button>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Label</label>
              <input id="addressLabel" type="text" placeholder="Home / Work / Other" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-primary transition">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Zip Code</label>
              <input id="addressZip" type="text" placeholder="500032" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-primary transition">
            </div>
          </div>
          <div class="mt-4">
            <label class="block text-sm font-medium text-gray-700 mb-2">Street Address</label>
            <input id="addressStreet" type="text" placeholder="Street / Building / Area" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-primary transition">
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">City</label>
              <input id="addressCity" type="text" placeholder="Hyderabad" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-primary transition">
            </div>
            <div class="flex items-end gap-3">
              <label class="inline-flex items-center gap-2 px-4 py-3 border-2 border-gray-200 rounded-lg w-full">
                <input id="addressDefault" type="checkbox" class="custom-radio">
                <span class="text-sm font-medium text-gray-700">Set as default</span>
              </label>
            </div>
          </div>
          <div class="mt-4">
            <label class="block text-sm font-medium text-gray-700 mb-2">Notes (optional)</label>
            <textarea id="addressNotes" rows="3" placeholder="Landmark, floor, delivery instructions" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-primary transition"></textarea>
          </div>
          <div id="addressStatus" class="hidden mt-4 p-3 text-sm rounded"></div>
          <!-- Footer: primary action sits right on desktop and on top when
               stacked on mobile (flex-col-reverse inverts the DOM order). -->
          <div class="mt-6 pt-5 border-t border-gray-200 flex flex-col-reverse sm:flex-row sm:justify-end gap-3">
            <button id="cancelAddressBtn" class="w-full sm:w-auto sm:min-w-[120px] px-6 py-3 bg-gray-100 text-gray-800 !rounded-button font-semibold hover:bg-gray-200 transition">Cancel</button>
            <button id="saveAddressBtn" class="w-full sm:w-auto sm:min-w-[160px] px-6 py-3 bg-primary text-white !rounded-button font-semibold hover:bg-green-600 transition">Save Address</button>
          </div>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-lg p-8">
        <h2 class="text-2xl font-bold text-gray-900 mb-8">Change Password</h2>
        <div class="space-y-5 max-w-md">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Current Password</label>
            <input id="currentPwd" type="password" placeholder="Enter your current password" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-primary transition">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">New Password</label>
            <input id="newPwd" type="password" placeholder="Enter new password" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-primary transition">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Confirm New Password</label>
            <input id="confirmPwd" type="password" placeholder="Confirm new password" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-primary transition">
          </div>
          <div id="passwordStatus" class="hidden p-3 border-l-4 text-sm rounded"></div>
          <button id="changePasswordBtn" class="w-full px-6 py-3 bg-orange-500 text-white !rounded-button font-semibold hover:bg-orange-600 transition">Update Password</button>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-lg p-8 border-l-4 border-red-500">
        <h2 class="text-2xl font-bold text-gray-900 mb-4">Danger Zone</h2>
        <div class="space-y-6">
          <div>
            <p class="text-gray-600 mb-4">Logging out will clear your cart and session.</p>
            <button id="logout" class="px-6 py-3 bg-red-600 text-white !rounded-button font-semibold hover:bg-red-700 transition">
              <i class="ri-logout-box-r-line mr-2"></i> Logout
            </button>
          </div>
          <div class="pt-6 border-t border-red-200">
            <p class="text-gray-600 mb-4"><strong>Delete Account:</strong> Permanently delete your account and all associated data including orders and cart history. This action cannot be undone.</p>
            <button id="deleteAccount" class="px-6 py-3 bg-red-700 text-white !rounded-button font-semibold hover:bg-red-800 transition">
              <i class="ri-delete-bin-line mr-2"></i> Delete My Account
            </button>
          </div>
        </div>
      </div>
    `;

        const editBtn = document.getElementById("editBtn");
        const editForm = document.getElementById("editForm");
        const viewForm = document.getElementById("viewForm");
        const saveBtn = document.getElementById("saveBtn");
        const cancelBtn = document.getElementById("cancelBtn");
        const addAddressBtn = document.getElementById("addAddressBtn");
        const saveAddressBtn = document.getElementById("saveAddressBtn");
        const cancelAddressBtn = document.getElementById("cancelAddressBtn");
        const addressForm = document.getElementById("addressForm");
        const addressesList = document.getElementById("addressesList");
        const addressStatus = document.getElementById("addressStatus");
        const editStatus = document.getElementById("editStatus");
        const passwordStatus = document.getElementById("passwordStatus");

        if (editBtn)
          editBtn.addEventListener("click", () => {
            viewForm.style.display = "none";
            editForm.style.display = "block";
          });
        if (cancelBtn)
          cancelBtn.addEventListener("click", () => {
            editForm.style.display = "none";
            viewForm.style.display = "block";
          });
        if (addAddressBtn)
          addAddressBtn.addEventListener("click", () => {
            clearAddressForm();
            openAddressForm();
          });
        if (cancelAddressBtn)
          cancelAddressBtn.addEventListener("click", closeAddressForm);

        const closeAddressBtn = document.getElementById("closeAddressBtn");
        if (closeAddressBtn)
          closeAddressBtn.addEventListener("click", closeAddressForm);

        // Click the dimmed backdrop (not the panel) to dismiss.
        if (addressForm)
          addressForm.addEventListener("click", (e) => {
            if (e.target === addressForm) closeAddressForm();
          });

        document.addEventListener("keydown", (e) => {
          if (e.key !== "Escape") return;
          const address = document.getElementById("addressForm");
          if (address && !address.classList.contains("hidden"))
            closeAddressForm();
        });

        if (saveBtn)
          saveBtn.addEventListener("click", async () => {
            const name = document.getElementById("editName").value.trim();
            const email = document.getElementById("editEmail").value.trim();
            const phone = document.getElementById("editPhone").value.trim();
            if (!name || !email) {
              editStatus.className =
                "p-3 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm rounded";
              editStatus.textContent = "Please fill in all fields";
              editStatus.classList.remove("hidden");
              return;
            }
            try {
              profileState.name = name;
              profileState.email = email;
              profileState.phone = phone;
              await persistProfile(editStatus);
              setTimeout(() => {
                editForm.style.display = "none";
                viewForm.style.display = "block";
                showProfile();
              }, 1200);
            } catch (e) {
              editStatus.className =
                "p-3 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm rounded";
              editStatus.textContent = e.message;
              editStatus.classList.remove("hidden");
            }
          });

        if (saveAddressBtn)
          saveAddressBtn.addEventListener("click", async () => {
            const label = document.getElementById("addressLabel").value.trim();
            const street = document
              .getElementById("addressStreet")
              .value.trim();
            const city = document.getElementById("addressCity").value.trim();
            const zip = document.getElementById("addressZip").value.trim();
            const notes = document.getElementById("addressNotes").value.trim();
            const isDefault = document.getElementById("addressDefault").checked;
            if (!label || !street || !city || !zip) {
              addressStatus.className =
                "p-3 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm rounded";
              addressStatus.textContent =
                "Label, street, city, and zip are required";
              addressStatus.classList.remove("hidden");
              return;
            }

            const nextAddress = {
              _id: profileState.editingAddressId || `addr_${Date.now()}`,
              label,
              street,
              city,
              zip,
              notes,
              isDefault,
            };

            const others = profileState.addresses
              .filter((addr) => addr._id !== nextAddress._id)
              .map((addr) => ({
                ...addr,
                isDefault: isDefault ? false : addr.isDefault,
              }));
            profileState.addresses = normalizeAddresses([
              ...others,
              nextAddress,
            ]);
            if (isDefault && profileState.addresses.length) {
              // If user explicitly checked default, mark only that address as default
              profileState.addresses = profileState.addresses.map((addr) => ({
                ...addr,
                isDefault: addr._id === nextAddress._id,
              }));
            }
            // Do not auto-assign a default address when user didn't check it.

            try {
              await persistProfile(addressStatus);
              renderAddresses();
              closeAddressForm();
            } catch (e) {
              addressStatus.className =
                "p-3 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm rounded";
              addressStatus.textContent = e.message;
              addressStatus.classList.remove("hidden");
            }
          });

        renderAddresses();

        if (addressesList)
          addressesList.addEventListener("click", async (e) => {
            const btn = e.target.closest("[data-action]");
            if (!btn) return;
            const card = btn.closest("[data-address-id]");
            if (!card) return;
            const id = card.dataset.addressId;
            const action = btn.dataset.action;
            const addr = profileState.addresses.find((a) => a._id === id);
            if (!addr) return;

            if (action === "edit") {
              openAddressForm(addr);
              return;
            }
            if (action === "default") {
              profileState.addresses = profileState.addresses.map((a) => ({
                ...a,
                isDefault: a._id === id,
              }));
              await persistProfile(addressStatus);
              renderAddresses();
              return;
            }
            if (action === "delete") {
              const confirmed = await showModal({
                title: "Delete Address",
                message: "Delete this saved address?",
                type: "warning",
                okText: "Delete",
                cancelText: "Cancel",
              });
              if (!confirmed) return;
              profileState.addresses = profileState.addresses.filter(
                (a) => a._id !== id,
              );
              // Do not auto-assign a default address after deletion; preserve explicit flags only.
              await persistProfile(addressStatus);
              renderAddresses();
            }
          });

        // Wire password change
        document
          .getElementById("changePasswordBtn")
          .addEventListener("click", async () => {
            const current = document.getElementById("currentPwd").value;
            const newPwd = document.getElementById("newPwd").value;
            const confirm = document.getElementById("confirmPwd").value;

            if (!current || !newPwd || !confirm) {
              passwordStatus.className =
                "p-3 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm rounded";
              passwordStatus.textContent = "Please fill in all password fields";
              passwordStatus.classList.remove("hidden");
              return;
            }

            if (newPwd !== confirm) {
              passwordStatus.className =
                "p-3 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm rounded";
              passwordStatus.textContent = "New passwords do not match";
              passwordStatus.classList.remove("hidden");
              return;
            }

            if (newPwd.length < 6) {
              passwordStatus.className =
                "p-3 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm rounded";
              passwordStatus.textContent =
                "New password must be at least 6 characters";
              passwordStatus.classList.remove("hidden");
              return;
            }

            try {
              const res = await fetch("/api/users/change-password", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  Authorization: "Bearer " + token,
                },
                body: JSON.stringify({
                  oldPassword: current,
                  newPassword: newPwd,
                }),
              });

              if (res.ok) {
                passwordStatus.className =
                  "p-3 bg-green-50 border-l-4 border-green-500 text-green-700 text-sm rounded";
                passwordStatus.textContent = "Password changed successfully";
                passwordStatus.classList.remove("hidden");
                document.getElementById("currentPwd").value = "";
                document.getElementById("newPwd").value = "";
                document.getElementById("confirmPwd").value = "";
                setTimeout(() => passwordStatus.classList.add("hidden"), 3000);
              } else {
                const err = await res.json();
                passwordStatus.className =
                  "p-3 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm rounded";
                passwordStatus.textContent =
                  err.error || "Password change failed";
                passwordStatus.classList.remove("hidden");
              }
            } catch (e) {
              passwordStatus.className =
                "p-3 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm rounded";
              passwordStatus.textContent = "Error: " + e.message;
              passwordStatus.classList.remove("hidden");
            }
          });

        function showModal({
          title = "Confirm",
          message = "",
          type = "info",
          okText = "OK",
          cancelText = "Cancel",
        } = {}) {
          return new Promise((resolve) => {
            const modal = document.getElementById("globalModal");
            const titleEl = document.getElementById("modalTitle");
            const msgEl = document.getElementById("modalMessage");
            const okBtn = document.getElementById("modalOk");
            const cancelBtn = document.getElementById("modalCancel");
            const icon = document.getElementById("modalIcon");

            titleEl.textContent = title;
            msgEl.textContent = message;
            okBtn.textContent = okText;
            cancelBtn.textContent = cancelText;

            icon.className = "";
            if (type === "warning")
              icon.innerHTML = '<i class="ri-alert-line text-yellow-500"></i>';
            else if (type === "error")
              icon.innerHTML =
                '<i class="ri-close-circle-line text-red-500"></i>';
            else if (type === "success")
              icon.innerHTML =
                '<i class="ri-checkbox-circle-line text-green-500"></i>';
            else
              icon.innerHTML =
                '<i class="ri-information-line text-blue-500"></i>';

            modal.classList.remove("hidden");
            modal.setAttribute("aria-hidden", "false");

            function cleanup(choice) {
              modal.classList.add("hidden");
              modal.setAttribute("aria-hidden", "true");
              okBtn.removeEventListener("click", onOk);
              cancelBtn.removeEventListener("click", onCancel);
              modal.removeEventListener("click", onBackdrop);
              resolve(choice);
            }

            function onOk(e) {
              e.stopPropagation();
              cleanup(true);
            }
            function onCancel(e) {
              e.stopPropagation();
              cleanup(false);
            }
            function onBackdrop(e) {
              if (e.target === modal) cleanup(false);
            }

            okBtn.addEventListener("click", onOk);
            cancelBtn.addEventListener("click", onCancel);
            modal.addEventListener("click", onBackdrop);
          });
        }

        document
          .getElementById("logout")
          .addEventListener("click", async () => {
            const confirmed = await showModal({
              title: "Logout",
              message: "Are you sure you want to logout?",
              type: "warning",
              okText: "Yes, logout",
              cancelText: "Cancel",
            });
            if (confirmed) {
              localStorage.removeItem(tokenKey);
              localStorage.removeItem(userKey);
              localStorage.removeItem("gs_clientId");
              window.location.href = "/main.html";
            }
          });

        document
          .getElementById("deleteAccount")
          .addEventListener("click", async () => {
            const confirmed = await showModal({
              title: "Delete Account",
              message:
                "Are you sure you want to delete your account? This action cannot be undone. All your data including orders and cart will be permanently deleted.",
              type: "error",
              okText: "Yes, delete",
              cancelText: "Cancel",
            });
            if (!confirmed) return;

            try {
              const res = await fetch("/api/users/me", {
                method: "DELETE",
                headers: { Authorization: "Bearer " + getToken() },
              });

              if (res.ok) {
                await showModal({
                  title: "Success",
                  message: "Your account has been deleted successfully.",
                  type: "success",
                  okText: "OK",
                  cancelText: "Close",
                });
                localStorage.removeItem(tokenKey);
                localStorage.removeItem(userKey);
                localStorage.removeItem("gs_clientId");
                window.location.href = "/main.html";
              } else {
                const err = await res.json();
                await showModal({
                  title: "Error",
                  message: err.error || "Failed to delete account",
                  type: "error",
                  okText: "OK",
                  cancelText: "Close",
                });
              }
            } catch (e) {
              await showModal({
                title: "Error",
                message: "Error: " + e.message,
                type: "error",
                okText: "OK",
                cancelText: "Close",
              });
            }
          });
      }

      showProfile();
    </script>

    <!-- Global Modal (hidden by default) -->
    <div
      id="globalModal"
      class="hidden fixed inset-0 z-60 flex items-center justify-center bg-black/50"
      aria-hidden="true"
    >
      <div
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
        class="bg-white max-w-md w-full rounded-xl shadow-lg p-6 mx-4"
      >
        <div class="flex items-start gap-4">
          <div id="modalIcon" class="text-2xl"></div>
          <div class="flex-1">
            <h3 id="modalTitle" class="text-lg font-semibold text-gray-900">
              Title
            </h3>
            <p id="modalMessage" class="text-sm text-gray-600 mt-2">Message</p>
          </div>
        </div>
        <div class="mt-6 flex justify-end gap-3">
          <button
            id="modalCancel"
            class="px-4 py-2 rounded-button bg-gray-100 text-gray-800 hover:bg-gray-200 transition"
          >
            Cancel
          </button>
          <button
            id="modalOk"
            class="px-4 py-2 rounded-button bg-primary text-white hover:bg-green-600 transition"
          >
            OK
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
