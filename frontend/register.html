<!doctype html>
<html lang="en">
  <head>
    <script src="/js/config.js"></script>
    <script src="/js/api-client.js"></script>
    <script src="/js/session.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <title>Register - GoSmoothie</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { primary: "#4ade80", secondary: "#f97316" },
            borderRadius: {
              none: "0px",
              sm: "4px",
              DEFAULT: "8px",
              md: "12px",
              lg: "16px",
              xl: "20px",
              "2xl": "24px",
              "3xl": "32px",
              full: "9999px",
              button: "8px",
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="/assets/toast.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/css/toast.css" />
    <link rel="stylesheet" href="/css/register.css" />
  </head>
  <body class="bg-gradient-to-br from-green-50 to-white min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm">
      <div
        class="container mx-auto px-4 py-4 flex items-center justify-between"
      >
        <div class="flex items-center gap-4">
          <a
            href="/main.html"
            aria-label="Back to home"
            title="Back to home"
            class="inline-flex items-center gap-2 px-4 py-2 bg-white border border-gray-200 text-gray-700 hover:border-primary hover:text-primary transition rounded-lg font-medium shadow-sm"
          >
            <i class="bi bi-arrow-left text-lg"></i>
          </a>
          <a href="/main.html" class="text-2xl font-['Pacifico'] text-primary"
            >GoSmoothie</a
          >
        </div>
        <nav class="flex space-x-6">
          <a
            href="/main.html"
            class="text-gray-700 hover:text-primary transition"
            >Home</a
          >
          <a
            href="/login.html"
            class="text-gray-700 hover:text-primary transition"
            >Login</a
          >
          <a href="/register.html" class="text-primary font-semibold"
            >Register</a
          >
        </nav>
      </div>
    </header>

    <!-- Register Section -->
    <section class="py-20">
      <div class="container mx-auto px-4 max-w-md">
        <div class="bg-white rounded-xl shadow-lg p-8">
          <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Join GoSmoothie</h1>
            <p class="text-gray-600 mt-2">
              Create your account to start ordering
            </p>
          </div>

          <form id="regForm" class="space-y-5">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2"
                >Full Name</label
              >
              <input
                name="name"
                type="text"
                placeholder="John Doe"
                required
                class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-primary transition"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2"
                >Email Address</label
              >
              <input
                name="email"
                type="email"
                placeholder="your@email.com"
                required
                class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-primary transition"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2"
                >Password</label
              >
              <input
                name="password"
                type="password"
                placeholder="••••••••"
                required
                class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-primary transition"
              />
              <div
                id="regPwdChecklist"
                class="hidden mt-3 rounded-lg border border-gray-200 bg-gray-50 p-3 text-sm text-gray-600"
              >
                <p class="font-medium text-gray-700 mb-2">
                  Password conditions
                </p>
                <ul class="space-y-2">
                  <li id="regCheck1" class="flex items-center gap-2">
                    <i
                      class="bi bi-x w-5 h-5 text-gray-400"
                      aria-hidden="true"
                    ></i>
                    <span>At least 8 characters</span>
                  </li>
                  <li id="regCheck2" class="flex items-center gap-2">
                    <i
                      class="bi bi-x w-5 h-5 text-gray-400"
                      aria-hidden="true"
                    ></i>
                    <span>Contains uppercase letter (A-Z)</span>
                  </li>
                  <li id="regCheck3" class="flex items-center gap-2">
                    <i
                      class="bi bi-x w-5 h-5 text-gray-400"
                      aria-hidden="true"
                    ></i>
                    <span>Contains number (0-9)</span>
                  </li>
                  <li id="regCheck4" class="flex items-center gap-2">
                    <i
                      class="bi bi-x w-5 h-5 text-gray-400"
                      aria-hidden="true"
                    ></i>
                    <span>Contains special character (!@#$%...)</span>
                  </li>
                </ul>
              </div>
            </div>

            <div
              id="errorMsg"
              class="hidden p-3 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm rounded"
            ></div>

            <button
              type="submit"
              class="w-full bg-primary text-white py-3 !rounded-button font-semibold text-lg hover:bg-green-600 transition"
            >
              Create Account
            </button>
          </form>

          <div class="mt-6 text-center">
            <p class="text-gray-600">
              Already have an account?
              <a
                href="/login.html"
                class="text-primary font-semibold hover:underline"
                >Sign in here</a
              >
            </p>
          </div>
        </div>
      </div>
    </section>

    <script src="/js/toast.js"></script>
    <script src="/js/register.js"></script>
  </body>
</html>
