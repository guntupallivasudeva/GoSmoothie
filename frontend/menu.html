<!doctype html>
<html lang="en">
  <head>
    <script src="/js/config.js"></script>
    <script src="/js/api-client.js"></script>
    <script src="/js/session.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <title>Full Menu - GoSmoothie</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { primary: "#4ade80", secondary: "#f97316" },
            borderRadius: {
              none: "0px",
              sm: "4px",
              DEFAULT: "8px",
              md: "12px",
              lg: "16px",
              xl: "20px",
              "2xl": "24px",
              "3xl": "32px",
              full: "9999px",
              button: "8px",
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
<link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
      <link rel="stylesheet" href="/css/toast.css" />
    <link rel="stylesheet" href="/css/menu.css" />
  </head>
  <body
    class="bg-gradient-to-br from-green-50 via-white to-orange-50 min-h-screen"
  >
    <header class="bg-white shadow-sm sticky top-0 z-50">
      <div
        class="container mx-auto px-4 py-4 flex items-center justify-between gap-4"
      >
        <a href="/main.html" class="text-2xl font-['Pacifico'] text-primary"
          >GoSmoothie</a
        >
        <nav class="hidden md:flex items-center space-x-6">
          <a
            href="/main.html"
            class="text-gray-700 hover:text-primary transition"
            >Home</a
          >
          <a href="/menu.html" class="text-primary font-semibold">Menu</a>
          <a
            href="/cart.html"
            class="text-gray-700 hover:text-primary transition"
            >Cart</a
          >
          <a
            href="/profile.html"
            class="text-gray-700 hover:text-primary transition"
            >Profile</a
          >
        </nav>
        <div class="flex items-center space-x-4">
          <div class="relative">
            <button
              id="cartBtn"
              class="w-10 h-10 flex items-center justify-center text-gray-700 hover:text-primary transition"
            >
              <i class="bi bi-cart text-xl"></i>
              <span
                class="absolute -top-1 -right-1 bg-primary text-white text-xs rounded-full w-5 h-5 flex items-center justify-center"
                >0</span
              >
            </button>
          </div>
          <div id="authLinks" class="flex items-center space-x-2">
            <a
              id="loginLink"
              href="/login.html"
              class="text-gray-700 hover:text-primary"
              >Login</a
            >
            <a
              id="registerLink"
              href="/register.html"
              class="text-gray-700 hover:text-primary"
              >Register</a
            >
          </div>
          <div id="userMenu" class="hidden relative">
            <button
              id="userMenuBtn"
              type="button"
              class="flex items-center gap-2 text-gray-700 hover:text-primary transition cursor-pointer"
            >
              <span id="userName" class="text-sm font-medium"></span>
            </button>
            <div
              id="userMenuDropdown"
              class="absolute right-0 top-full pt-2 w-48 opacity-0 invisible pointer-events-none translate-y-1 transition-all duration-150 z-50"
            >
              <div class="bg-white rounded-lg shadow-lg overflow-hidden">
                <a
                  href="/profile.html"
                  class="block px-4 py-3 text-gray-700 hover:bg-green-50 hover:text-primary transition flex items-center gap-2"
                >
                  <i class="bi bi-person"></i> My Profile
                </a>
                <button
                  id="logoutBtn"
                  class="w-full text-left px-4 py-3 text-gray-700 hover:bg-red-50 hover:text-red-600 transition flex items-center gap-2 border-t"
                >
                  <i class="bi bi-box-arrow-right"></i> Logout
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="relative overflow-hidden border-b border-green-100">
        <div
          class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,_rgba(74,222,128,0.14),_transparent_35%),radial-gradient(circle_at_bottom_left,_rgba(249,115,22,0.10),_transparent_30%)]"
        ></div>
        <div class="relative container mx-auto px-4 py-14 md:py-16">
          <div class="max-w-3xl">
            <a
              href="/main.html"
              aria-label="Back to home"
              title="Back to home"
              class="inline-flex items-center gap-2 px-4 py-2 bg-white border border-gray-200 text-gray-700 hover:border-primary hover:text-primary transition rounded-lg font-medium shadow-sm mb-6"
            >
              <i class="bi bi-arrow-left text-lg"></i>
            </a>
            <p
              class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-green-100 text-green-700 text-sm font-semibold mb-4"
            >
              Full Menu Collection
            </p>
            <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-4">
              Explore the complete GoSmoothie menu
            </h1>
            <p class="text-lg text-gray-600 max-w-2xl mb-6">
              Fresh smoothies, crisp salads, ice creams, seasonal drinks,
              protein bowls, and healthy snacks.
            </p>
            <div class="flex flex-wrap gap-3">
              <span
                class="px-3 py-2 rounded-full bg-green-50 text-green-700 border border-green-200 text-sm font-medium inline-flex items-center gap-2"
                ><span
                  class="w-4 h-4 rounded-sm border-2 border-green-600 flex items-center justify-center"
                  ><span class="w-2 h-2 rounded-full bg-green-600"></span></span
                >Vegetarian</span
              >
              <span
                class="px-3 py-2 rounded-full bg-red-50 text-red-700 border border-red-200 text-sm font-medium inline-flex items-center gap-2"
                ><span
                  class="w-4 h-4 rounded-sm border-2 border-red-600 flex items-center justify-center"
                  ><span
                    class="w-0 h-0 border-l-[4px] border-r-[4px] border-b-[7px] border-l-transparent border-r-transparent border-b-red-600"
                  ></span></span
                >Non-Vegetarian</span
              >
              <span
                class="px-3 py-2 rounded-full bg-white text-gray-700 border border-gray-200 text-sm font-medium"
                >Prices: Rs 80 - 300</span
              >
            </div>
          </div>
        </div>
      </section>

      <section class="py-10">
        <div class="container mx-auto px-4">
          <div
            class="mb-8 flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between"
          >
            <div class="flex flex-wrap gap-3" id="categoryLinks"></div>
            <div class="flex items-center gap-3 self-start lg:self-auto">
              <label
                for="vegFilter"
                class="text-sm font-semibold text-gray-700 whitespace-nowrap"
                >Filter</label
              >
              <select
                id="vegFilter"
                class="px-4 py-2 rounded-lg border border-gray-200 bg-white text-gray-700 focus:outline-none focus:border-primary shadow-sm"
              >
                <option value="all">All items</option>
                <option value="vegetarian">Vegetarian only</option>
                <option value="non-vegetarian">Non-Vegetarian only</option>
              </select>
            </div>
          </div>

          <div id="menuRoot" class="space-y-14"></div>
        </div>
      </section>
    </main>


    <!-- Global Modal (hidden by default) -->
    <div
      id="globalModalMenu"
      class="hidden fixed inset-0 z-60 flex items-center justify-center bg-black/50"
      aria-hidden="true"
    >
      <div
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitleMenu"
        class="bg-white max-w-md w-full rounded-xl shadow-lg p-6 mx-4"
      >
        <div class="flex items-start gap-4">
          <div id="modalIconMenu" class="text-2xl"></div>
          <div class="flex-1">
            <h3 id="modalTitleMenu" class="text-lg font-semibold text-gray-900">
              Title
            </h3>
            <p id="modalMessageMenu" class="text-sm text-gray-600 mt-2">
              Message
            </p>
          </div>
        </div>
        <div class="mt-6 flex justify-end gap-3">
          <button
            id="modalCancelMenu"
            class="px-4 py-2 rounded-button bg-gray-100 text-gray-800 hover:bg-gray-200 transition"
          >
            Cancel
          </button>
          <button
            id="modalOkMenu"
            class="px-4 py-2 rounded-button bg-primary text-white hover:bg-green-600 transition"
          >
            OK
          </button>
        </div>
      </div>
    </div>
      <script src="/js/toast.js"></script>
    <script src="/js/menu.js"></script>
  </body>
</html>
