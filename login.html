<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function useCanonicalLocalApp() {
      const isLocal = ['localhost', '127.0.0.1'].includes(window.location.hostname);
      if (isLocal && (window.location.hostname !== 'localhost' || window.location.port !== '3000')) {
        window.location.replace(`http://localhost:3000${window.location.pathname}${window.location.search}${window.location.hash}`);
      }
    })();
  </script>
  <script src="/api-client.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - GoSmoothie</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:'#4ade80',secondary:'#f97316'},borderRadius:{'none':'0px','sm':'4px',DEFAULT:'8px','md':'12px','lg':'16px','xl':'20px','2xl':'24px','3xl':'32px','full':'9999px','button':'8px'}}}}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    body {
      font-family: 'Poppins', sans-serif;
      color: #111827;
      background: linear-gradient(to bottom right, #f0fdf4, #ffffff);
    }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="bg-gradient-to-br from-green-50 to-white min-h-screen">
  <!-- Header -->
  <header class="bg-white shadow-sm">
    <div class="container mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a href="/main.html" aria-label="Back to home" title="Back to home" class="flex items-center gap-2 text-gray-700 hover:text-primary transition">
          <i class="bi bi-arrow-left"></i>
        </a>
        <a href="/main.html" class="text-2xl font-['Pacifico'] text-primary">GoSmoothie</a>
      </div>
      <nav class="flex space-x-6">
        <a href="/main.html" class="text-gray-700 hover:text-primary transition">Home</a>
        <a href="/login.html" class="text-primary font-semibold">Login</a>
        <a href="/register.html" class="text-gray-700 hover:text-primary transition">Register</a>
      </nav>
    </div>
  </header>

  <!-- Login Section -->
  <section class="py-20">
    <div class="container mx-auto px-4 max-w-md">
      <div class="bg-white rounded-xl shadow-lg p-8">
        <div class="text-center mb-8">
          <h1 class="text-3xl font-bold text-gray-900">Welcome Back</h1>
          <p class="text-gray-600 mt-2">Login to your GoSmoothie account</p>
        </div>

        <form id="loginForm" class="space-y-5">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
            <input name="email" type="email" placeholder="your@email.com" required class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-primary transition">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
            <input id="loginPassword" name="password" type="password" placeholder="••••••••" required class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-primary transition">
            <div id="loginPwdChecklist" class="mt-3 hidden space-y-1 text-sm">
              <div class="flex items-center gap-2"><span id="loginCheck1" class="text-gray-400"><i class="bi bi-x"></i></span> <span>At least 8 characters</span></div>
              <div class="flex items-center gap-2"><span id="loginCheck2" class="text-gray-400"><i class="bi bi-x"></i></span> <span>Contains uppercase letter (A-Z)</span></div>
              <div class="flex items-center gap-2"><span id="loginCheck3" class="text-gray-400"><i class="bi bi-x"></i></span> <span>Contains number (0-9)</span></div>
              <div class="flex items-center gap-2"><span id="loginCheck4" class="text-gray-400"><i class="bi bi-x"></i></span> <span>Contains special character (!@#$%...)</span></div>
            </div>
          </div>

          <div id="errorMsg" class="hidden p-3 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm rounded"></div>

          <button type="submit" class="w-full bg-primary text-white py-3 !rounded-button font-semibold text-lg hover:bg-green-600 transition">Login</button>
        </form>

        <div class="mt-6 text-center">
          <p class="text-gray-600">Don't have an account? <a href="/register.html" class="text-primary font-semibold hover:underline">Sign up here</a></p>
        </div>

        <div class="mt-6 pt-6 border-t border-gray-200">
          <p class="text-xs text-gray-500 text-center">Demo Account: <br><span class="font-mono">demo@local</span> / <span class="font-mono">password123</span></p>
        </div>
      </div>
    </div>
  </section>
  <script>
  const apiBaseUrl = ['localhost', '127.0.0.1'].includes(window.location.hostname) && window.location.port !== '3000'
    ? `http://${window.location.hostname}:3000`
    : '';
  const apiUrl = (path) => `${apiBaseUrl}${path}`;

  // Password strength utilities for login (UI only)
  function evaluatePassword(pw){
    return {
      len: pw.length >= 8,
      upper: /[A-Z]/.test(pw),
      num: /\d/.test(pw),
      special: /[!@#$%^&*()_\-+=\[\]{};:'"\\|,.<>\/?]/.test(pw)
    };
  }

  const loginPwdInput = document.getElementById('loginPassword');
  const loginPwdChecklist = document.getElementById('loginPwdChecklist');
  const loginChecks = ['loginCheck1', 'loginCheck2', 'loginCheck3', 'loginCheck4'];
  const loginCheckRules = ['len', 'upper', 'num', 'special'];

  loginPwdInput.addEventListener('input', () => {
    const v = loginPwdInput.value || '';
    if(!v){ loginPwdChecklist.classList.add('hidden'); return; }
    const s = evaluatePassword(v);
    loginPwdChecklist.classList.remove('hidden');
    
    loginChecks.forEach((id, idx) => {
      const el = document.getElementById(id);
      const isValid = s[loginCheckRules[idx]];
      if(isValid){
        el.className = 'text-green-500';
        el.innerHTML = '<i class="bi bi-check"></i>';
      } else {
        el.className = 'text-gray-400';
        el.innerHTML = '<i class="bi bi-x"></i>';
      }
    });
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.classList.add('hidden');
    
    const f = new FormData(e.target);
    try {
      const res = await fetch(apiUrl('/api/auth/login'), {
      method: 'POST', 
      headers: { 'Content-Type': 'application/json' }, 
      body: JSON.stringify({ email: f.get('email'), password: f.get('password') }) 
    });

    const data = await res.json().catch(() => ({}));
    if(data.token) {
      localStorage.setItem('gs_token', data.token);
      localStorage.setItem('gs_user', JSON.stringify(data.user));
      // Cookies are shared across localhost ports, unlike localStorage. This
      // keeps the session available when pages are opened via Live Server.
      document.cookie = `gs_token=${encodeURIComponent(data.token)}; Path=/; Max-Age=604800; SameSite=Lax`;
      document.cookie = `gs_user=${encodeURIComponent(JSON.stringify(data.user || {}))}; Path=/; Max-Age=604800; SameSite=Lax`;
      // merge anonymous cart into user cart
      const clientId = localStorage.getItem('gs_clientId');
      if(clientId) {
        await fetch(apiUrl('/api/cart/merge'), {
          method: 'POST', 
          headers: { 
            'Content-Type': 'application/json', 
            'Authorization': 'Bearer ' + data.token 
          }, 
          body: JSON.stringify({ clientId }) 
        });
        localStorage.removeItem('gs_clientId');
      }
      // A Live Server preview and the Express app use different localhost
      // ports, so their localStorage is isolated. Carry the just-created
      // session in the fragment (never sent to the server) to hydrate the
      // Express-hosted main page, then it is removed immediately.
      const session = new URLSearchParams({
        gs_token: data.token,
        gs_user: JSON.stringify(data.user || {})
      });
      window.location.href = `${apiBaseUrl}/main.html#${session.toString()}`;
    } else {
      errorMsg.textContent = data.error || (res.status === 405
        ? 'The API server is unavailable. Start the app with npm.cmd run dev and open http://localhost:3000/login.html.'
        : 'Login failed. Please try again.');
      errorMsg.classList.remove('hidden');
    }
    } catch (error) {
      errorMsg.textContent = 'Unable to reach the API server. Start it with npm.cmd run dev and open http://localhost:3000/login.html.';
      errorMsg.classList.remove('hidden');
    }
  });
  </script>
</body>
</html>
