<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/api-client.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - GoSmoothie</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:'#4ade80',secondary:'#f97316'},borderRadius:{'none':'0px','sm':'4px',DEFAULT:'8px','md':'12px','lg':'16px','xl':'20px','2xl':'24px','3xl':'32px','full':'9999px','button':'8px'}}}}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
<script src="/assets/toast.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="bg-gradient-to-br from-green-50 to-white min-h-screen">
  <!-- Header -->
  <header class="bg-white shadow-sm">
    <div class="container mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a href="/main.html" aria-label="Back to home" title="Back to home" class="flex items-center gap-2 text-gray-700 hover:text-primary transition">
          <i class="bi bi-arrow-left w-5 h-5"></i>
        </a>
        <a href="/main.html" class="text-2xl font-['Pacifico'] text-primary">GoSmoothie</a>
      </div>
      <nav class="flex space-x-6">
        <a href="/main.html" class="text-gray-700 hover:text-primary transition">Home</a>
        <a href="/login.html" class="text-gray-700 hover:text-primary transition">Login</a>
        <a href="/register.html" class="text-primary font-semibold">Register</a>
      </nav>
    </div>
  </header>

  <!-- Register Section -->
  <section class="py-20">
    <div class="container mx-auto px-4 max-w-md">
      <div class="bg-white rounded-xl shadow-lg p-8">
        <div class="text-center mb-8">
          <h1 class="text-3xl font-bold text-gray-900">Join GoSmoothie</h1>
          <p class="text-gray-600 mt-2">Create your account to start ordering</p>
        </div>

        <form id="regForm" class="space-y-5">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
            <input name="name" type="text" placeholder="John Doe" required class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-primary transition">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
            <input name="email" type="email" placeholder="your@email.com" required class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-primary transition">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
            <input name="password" type="password" placeholder="••••••••" required class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-primary transition">
            <div id="regPwdChecklist" class="hidden mt-3 rounded-lg border border-gray-200 bg-gray-50 p-3 text-sm text-gray-600">
              <p class="font-medium text-gray-700 mb-2">Password conditions</p>
              <ul class="space-y-2">
                <li id="regCheck1" class="flex items-center gap-2">
                  <i class="bi bi-x w-5 h-5 text-gray-400" aria-hidden="true"></i>
                  <span>At least 8 characters</span>
                </li>
                <li id="regCheck2" class="flex items-center gap-2">
                  <i class="bi bi-x w-5 h-5 text-gray-400" aria-hidden="true"></i>
                  <span>Contains uppercase letter (A-Z)</span>
                </li>
                <li id="regCheck3" class="flex items-center gap-2">
                  <i class="bi bi-x w-5 h-5 text-gray-400" aria-hidden="true"></i>
                  <span>Contains number (0-9)</span>
                </li>
                <li id="regCheck4" class="flex items-center gap-2">
                  <i class="bi bi-x w-5 h-5 text-gray-400" aria-hidden="true"></i>
                  <span>Contains special character (!@#$%...)</span>
                </li>
              </ul>
            </div>
          </div>

          <div id="errorMsg" class="hidden p-3 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm rounded"></div>

          <button type="submit" class="w-full bg-primary text-white py-3 !rounded-button font-semibold text-lg hover:bg-green-600 transition">Create Account</button>
        </form>

        <div class="mt-6 text-center">
          <p class="text-gray-600">Already have an account? <a href="/login.html" class="text-primary font-semibold hover:underline">Sign in here</a></p>
        </div>
      </div>
    </div>
  </section>

  <script>
  function evaluatePassword(pw){
    return {
      len: pw.length >= 8,
      upper: /[A-Z]/.test(pw),
      num: /\d/.test(pw),
      special: /[!@#$%^&*()_\-+=\[\]{};:'"\\|,.<>\/?]/.test(pw)
    };
  }

  const regPwdInput = document.querySelector('input[name="password"]');
  const regPwdChecklist = document.getElementById('regPwdChecklist');
  const regChecks = ['regCheck1', 'regCheck2', 'regCheck3', 'regCheck4'];
  const regCheckRules = ['len', 'upper', 'num', 'special'];

  if(regPwdInput && regPwdChecklist){
    regPwdInput.addEventListener('input', () => {
      const v = regPwdInput.value || '';
      if(!v){ regPwdChecklist.classList.add('hidden'); return; }
      const s = evaluatePassword(v);
      regPwdChecklist.classList.remove('hidden');

      regChecks.forEach((id, idx) => {
        const el = document.getElementById(id);
        const icon = el?.querySelector('i, svg');
        const isValid = s[regCheckRules[idx]];
        if(isValid){
          el.className = 'flex items-center gap-2 text-green-700';
          if(icon) icon.outerHTML = '<i class="bi bi-check w-5 h-5 text-green-500"></i>';
        } else {
          el.className = 'flex items-center gap-2 text-gray-600';
          if(icon) icon.outerHTML = '<i class="bi bi-x w-5 h-5 text-gray-400"></i>';
        }
      });
    });
  }

  document.getElementById('regForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.classList.add('hidden');
    
    const f = new FormData(e.target);
    const apiBaseUrl = ['localhost', '127.0.0.1'].includes(window.location.hostname) && window.location.port !== '3000'
      ? `http://${window.location.hostname}:3000`
      : '';
    const apiUrl = (path) => `${apiBaseUrl}${path}`;
    const res = await fetch(apiUrl('/api/auth/register'), {
      method: 'POST', 
      headers: { 'Content-Type': 'application/json' }, 
      body: JSON.stringify({ 
        name: f.get('name'),
        email: f.get('email'), 
        password: f.get('password') 
      }) 
    });
    
    const data = await res.json();
    if(data.token) {
      localStorage.setItem('gs_token', data.token);
      localStorage.setItem('gs_user', JSON.stringify(data.user));
      // merge anonymous cart into user cart
      const clientId = localStorage.getItem('gs_clientId');
      if(clientId) {
        await fetch(apiUrl('/api/cart/merge'), {
          method: 'POST', 
          headers: { 
            'Content-Type': 'application/json', 
            'Authorization': 'Bearer ' + data.token 
          }, 
          body: JSON.stringify({ clientId }) 
        });
        localStorage.removeItem('gs_clientId');
      }
      window.location.href = '/main.html';
    } else {
      errorMsg.textContent = data.error || 'Registration failed. Please try again.';
      errorMsg.classList.remove('hidden');
    }
  });
  </script>
  <script>
  (function(){
    document.querySelectorAll('input[type="password"]').forEach(input => {
      if(input.dataset.pwToggle) return;
      const wrapper = document.createElement('div'); wrapper.className = 'relative';
      input.parentNode.insertBefore(wrapper, input);
      wrapper.appendChild(input);
      input.dataset.pwToggle = '1';
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.setAttribute('aria-label','Toggle password visibility');
      btn.className = 'absolute right-2 top-1/2 -translate-y-1/2 text-gray-500 p-1';
      btn.innerHTML = '<i class="bi bi-eye w-5 h-5"></i>';
      wrapper.appendChild(btn);
      btn.addEventListener('click', () => {
        if(input.type === 'password'){ input.type = 'text'; btn.innerHTML = '<i class="bi bi-eye-slash w-5 h-5"></i>'; }
        else { input.type = 'password'; btn.innerHTML = '<i class="bi bi-eye w-5 h-5"></i>'; }
      });
    });
  })();
  </script>
</body>
</html>
